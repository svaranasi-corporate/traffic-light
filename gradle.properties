# Project-wide Gradle settings

# Use AndroidX libraries (required for all modern Android/Compose projects)
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enable Gradle build cache for faster incremental builds
org.gradle.caching=true

# Allocate more heap for the Gradle daemon (helps with Compose compilation)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable configuration cache for faster build configuration phase
org.gradle.configuration-cache=true
